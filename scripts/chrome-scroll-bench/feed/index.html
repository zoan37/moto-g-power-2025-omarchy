<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll bench feed</title>
<style>
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#fff;color:#0f1419}
header{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);padding:12px 16px;font-weight:700;border-bottom:1px solid #eff3f4}
.card{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid #eff3f4}
.av{width:40px;height:40px;border-radius:50%;flex:none}
.name{font-weight:700}.handle{color:#536471;font-weight:400}
.media{margin-top:10px;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;border:1px solid #cfd9de}
.acts{display:flex;justify-content:space-between;color:#536471;margin-top:8px;max-width:320px}
</style></head><body><header>Home</header><main id="feed"></main>
<script>
const words="the of and to in is that it for on was with as at by this from have they are but not you all can will one about more when there what out up so some time would like make how only new also year just".split(" ");
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const text=n=>Array.from({length:n},()=>words[Math.floor(rnd()*words.length)]).join(" ");
const feed=document.getElementById("feed"); let html="";
for(let i=0;i<400;i++){
  const img=rnd()<0.6?`<img class="media" loading="lazy" decoding="async" src="img${i%12}.jpg?${i}">`:"";
  html+=`<article class="card"><img class="av" src="av${i%12}.png"><div><div><span class="name">User ${i}</span> <span class="handle">@user${i} · ${1+i%59}m</span></div><div>${text(12+Math.floor(rnd()*40))}</div>${img}<div class="acts"><span>💬 ${i%50}</span><span>🔁 ${i%30}</span><span>❤ ${i*7%500}</span><span>📊 ${i*31%9000}</span></div></div></article>`;
}
feed.innerHTML=html;
</script></body></html>
