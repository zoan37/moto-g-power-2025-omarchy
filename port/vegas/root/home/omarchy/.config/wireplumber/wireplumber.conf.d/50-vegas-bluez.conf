# Phone: Bluetooth audio without a logind seat. WirePlumber's BlueZ monitor
# only runs while the user's session is active on a seat; the phone's desktop
# runs in the lingering user manager's seatless session, so it never would.
# There is one user, so seat arbitration isn't needed.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
