# Moto G Power (vegas): native Wayland, no Xwayland. The kernel has no
# unprivileged user namespaces (CONFIG_USER_NS off), so no Chromium sandbox.
# Mali runs through kbase, not a DRM render node. Chromium's GPU process does
# load the patched kbase Mesa, but crash-loops on eglDupNativeFenceFDANDROID,
# so render in software until the driver gains native fence FDs.
--ozone-platform=wayland
--enable-wayland-ime
--password-store=basic
--enable-features=TouchpadOverscrollHistoryNavigation
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
--no-sandbox
--disable-gpu
--disable-dev-shm-usage
