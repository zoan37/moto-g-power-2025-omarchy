# Persistent journal for the systemd bring-up (a failed boot's log must survive the
# reboot), kept small: the root is ext4 on a direct-I/O loop device (or the microSD
# rescue copy). The verified power path is sync + direct reboot syscall, so the
# journal is synced often rather than only at a clean shutdown.
[Journal]
Storage=persistent
SystemMaxUse=64M
RuntimeMaxUse=32M
SyncIntervalSec=30s
