# Phone (vegas) on systemd: notes/systemd-migration-20261011.md
[Manager]
# Never open /dev/watchdog: MediaTek's kernel kicker feeds the hardware watchdog,
# and a userspace opener that stops kicking (or a 10 min reboot watchdog during a
# hung shutdown) would reset the phone.
RuntimeWatchdogSec=off
RebootWatchdogSec=off
KExecWatchdogSec=off
# A crashed PID 1 reboots (the ramdisk's systemd-pending strike then starts
# native-init) instead of freezing. CrashAction= is systemd >= 256, CrashReboot=
# the older name; the unknown one only logs a warning.
CrashAction=reboot
CrashReboot=yes
DefaultTimeoutStopSec=15s
