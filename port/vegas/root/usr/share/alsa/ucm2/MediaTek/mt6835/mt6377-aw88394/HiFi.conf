# Use case configuration for mt6835-mt6377 on the Moto G Power 2025 (vegas). DRAFT.
#
# Sequences translate /vendor/etc/audio_device.xml paths (cited per device). PCMs are looked
# up by front-end name, so they don't depend on the DAI link numbering
# (expected: Playback_1 = 0, Playback_2 = 2, Capture_1 = 10).
#
# No JackControl: mt6377-accdet reports the 3.5 mm jack only as an input device
# ("mt6835-mt6377 Headset Jack", SW_HEADPHONE_INSERT/SW_MICROPHONE_INSERT), with no ALSA
# jack kcontrol, so PipeWire cannot see plug state. Speaker therefore ranks above Headphones.

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value.TQ "HiFi"
}

# Both AW88394 amps (stereo): "speaker_output_mode_music" plus the idle half of
# "RCV_OUT_DEVICE_CTRL_PRE_PMU" (aw_dev_1 back on, aw_dev_0 back to Music).
# SPK_PATH_NO_ANA=yes: Android does not use the MT6377 LOL path ("speaker_output") here.
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='aw_dev_0_prof' Music"
		cset "name='aw_dev_1_prof' Music"
		cset "name='aw_dev_0_switch' Enable"
		cset "name='aw_dev_1_switch' Enable"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^Playback_1 '}"
	}
}

# Earpiece = aw_dev_0 (6-0034) alone in its "Receiver" profile on I2S3
# ("RCV_OUT_DEVICE_CTRL_PRE_PMU" turnon/turnoff; RCV_PATH_NO_ANA=yes, RCV_OUT path=I2S3).
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='aw_dev_1_switch' Disable"
		cset "name='aw_dev_0_switch' Enable"
		cset "name='aw_dev_0_prof' Receiver"
	]

	DisableSequence [
		cset "name='aw_dev_1_switch' Enable"
		cset "name='aw_dev_0_switch' Enable"
		cset "name='aw_dev_0_prof' Music"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^Playback_1 '}"
	}
}

# MT6377 headphone amp: "headphone_output". Gain fixed in init.conf ('Headset Volume' 9 = -1 dB).
SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
	]

	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]

	Value {
		PlaybackPriority 90
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^Playback_2 '}"
	}
}

# Main (bottom) analog mic on AIN0 through ADC L, both channels: "builtin_Mic_SingleMic".
# DT mt6377codec mediatek,mic-type = <1 1 1> (ACC/AMIC), dmic-mode 0.
# Dual-mic alternative ("builtin_Mic_DualMic"): MISO1_MUX UL1_CH2, ADC_R_Mux Right Preamplifier,
# PGA_R_Mux AIN2 (back mic) on channel 2.
SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='DMIC0_MUX' DMIC_DATA0"
		cset "name='DMIC1_MUX' DMIC_DATA0"
	]

	DisableSequence [
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='UL2_SRC_MUX' AMIC"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='^Capture_1 '}"
	}
}

# Headset mic on AIN1 through ADC L: "headset_mic_input". Shares ADC L with the internal mic.
SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='PGA_L_Mux' AIN1"
	]

	DisableSequence [
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='^Capture_1 '}"
	}
}
