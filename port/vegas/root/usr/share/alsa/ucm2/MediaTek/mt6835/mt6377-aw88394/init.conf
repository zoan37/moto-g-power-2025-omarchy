# MT6835 + MT6377 with Awinic smart amps (Moto G Power 2025, vegas)
#
# Front ends (DPCM): Playback_1/DL1 -> I2S3 -> aw883xx 6-0034/6-0035/6-0037 (speaker, earpiece)
#                    Playback_2/DL2 -> ADDA -> MT6377 HP (3.5 mm jack)
#                    Capture_1/UL1  <- ADDA <- MT6377 ADC L (AMIC: AIN0 main, AIN1 headset)
#
# PipeWire's ACP opens every PCM before any device EnableSequence runs, and MediaTek DPCM
# front ends reject hw_params until routed to a back end (same as the MT8189 Chromebook),
# so the AFE interconnects are set here instead of per device.

BootSequence [
	# Android audio_device.xml "reset_device_setting"
	cset "name='ADDA_UL_Mux' MTKAIF"
	cset "name='LOL Mux' Open"
	cset "name='HPL Mux' Open"
	cset "name='HPR Mux' Open"
	cset "name='RCV Mux' Open"
	cset "name='ADC_L_Mux' Idle"
	cset "name='ADC_R_Mux' Idle"
	cset "name='PGA_L_Mux' None"
	cset "name='PGA_R_Mux' None"
	cset "name='MISO0_MUX' UL1_CH1"
	cset "name='MISO1_MUX' UL1_CH2"
	cset "name='MISO2_MUX' UL2_CH1"
	cset "name='UL_SRC_MUX' AMIC"
	cset "name='UL2_SRC_MUX' AMIC"

	# Speaker/earpiece: PLAYBACK1_TO_I2S3. The smart amps want the APLL clock
	# (SmartPa_AudioParam.xml aw883xx is_apll_needed=1; SPK_INIT sets I2S3_HD_Mux Low_Jitter).
	cset "name='I2S3_CH1 DL1_CH1' 1"
	cset "name='I2S3_CH2 DL1_CH2' 1"
	cset "name='I2S3_HD_Mux' Low_Jitter"

	# Headphones: PLAYBACK2_TO_ADDA_DL
	cset "name='ADDA_DL_CH1 DL2_CH1' 1"
	cset "name='ADDA_DL_CH2 DL2_CH2' 1"

	# Microphones: ADDA_TO_CAPTURE1
	cset "name='UL1_CH1 ADDA_UL_CH1' 1"
	cset "name='UL1_CH2 ADDA_UL_CH2' 1"

	# MT6377 analog gains. CAUTION: 'Headset Volume' raw 0 = +8 dB ... 8 = 0 dB ... 18 = -10 dB
	# (the kernel's TLV is inverted, so never expose it as a PlaybackMixerElem).
	# Android: PlaybackVolAna "Others,HS" headset_pga=9; RecordVol "Sound recording" ul_gain=34 dB
	# (24 dB analog max, rest digital). PGA1/PGA2 Volume: 0..4 = 0..24 dB.
	cset "name='Headset Volume' 9,9"
	cset "name='PGA1 Volume' 4"
	cset "name='PGA2 Volume' 4"

	# Smart amps: idle state from audio_device.xml (RCV_OUT_DEVICE_CTRL_PRE_PMU turnoff).
	cset "name='aw_dev_0_prof' Music"
	cset "name='aw_dev_1_prof' Music"
	cset "name='aw_dev_0_switch' Enable"
	cset "name='aw_dev_1_switch' Enable"
	# aw_dev_2 is the AW88166 at 6-0037 (profiles Music/Hac/Bypass), on the same I2S3 link.
	# Android's HAL drives aw_dev_2_switch/prof only for hearing-aid (HAC) mode; keep it off.
	# Last, so a missing control cannot skip the lines above.
	cset "name='aw_dev_2_switch' Disable"
]
